<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Courses</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">Course Manager</a>
    </div>
</nav>
<div class="container mt-4">
    <div th:replace="~{fragments/alerts :: alerts}"></div>
    <h2>My Courses</h2>
    <div class="row">
        <div class="col-md-4 mb-3" th:each="course : ${courses}">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title" th:text="${course.title}">Title</h5>
                    <p class="card-text" th:text="${course.description}">Description</p>
                    <form th:action="@{'/courses/' + ${course.id} + '/cancel'}" method="post">
                        <button class="btn btn-danger btn-sm">Cancel Enrollment</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <a href="/courses" class="btn btn-primary">Browse More Courses</a>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
