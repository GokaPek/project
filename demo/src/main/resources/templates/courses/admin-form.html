<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Create Course</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">Course Manager</a>
    </div>
</nav>
<div class="container mt-4">
    <h2>Create New Course</h2>
    <form th:action="@{/courses/admin/save}" th:object="${course}" method="post">
        <div class="mb-3">
            <label class="form-label">Title</label>
            <input type="text" th:field="*{title}" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea th:field="*{description}" class="form-control" rows="3"></textarea>
        </div>
        <div class="mb-3">
            <label class="form-label">Max Students</label>
            <input type="number" th:field="*{maxStudents}" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary">Save</button>
        <a href="/courses" class="btn btn-secondary">Cancel</a>
    </form>
</div>
</body>
</html>
