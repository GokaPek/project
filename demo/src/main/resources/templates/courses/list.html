<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Courses</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/header :: navbar}"></div>
<div class="container mt-4">
    <div th:replace="~{fragments/alerts :: alerts}"></div>
    <h2>All Courses</h2>
    <div class="row">
        <div class="col-md-4 mb-3" th:each="course : ${courses}">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title" th:text="${course.title}">Title</h5>
                    <p class="card-text" th:text="${course.description}">Description</p>
                    <p>Enrolled: <span th:text="${course.enrolledCount} + '/' + ${course.maxStudents}"></span></p>
                    <div sec:authorize="isAuthenticated()">
                        <form th:if="${myCourses != null and !myCourses.contains(course) and course.available}"
                              th:action="@{'/courses/' + ${course.id} + '/enroll'}" method="post">
                            <button class="btn btn-success btn-sm">Enroll</button>
                        </form>
                        <form th:if="${myCourses != null and myCourses.contains(course)}"
                              th:action="@{'/courses/' + ${course.id} + '/cancel'}" method="post">
                            <button class="btn btn-danger btn-sm">Cancel</button>
                        </form>
                    </div>

                    <!-- Блок заметок -->
                    <div class="mt-3">
                        <button class="btn btn-sm btn-outline-info" type="button"
                                th:attr="data-bs-target='#notes-' + ${course.id}"
                                data-bs-toggle="collapse">Show Notes</button>

                        <div th:attr="id='notes-' + ${course.id}" class="collapse mt-2">
                            <div th:each="note : ${notesMap.get(course.id)}" class="alert alert-secondary small">
                                <span th:text="${note.content}"></span>
                                <br><small th:text="${#temporals.format(note.createdAt, 'dd.MM.yyyy HH:mm')}"></small>
                            </div>
                            <form th:action="@{'/courses/' + ${course.id} + '/add-note'}" method="post" class="mt-2">
                                <input type="text" name="content" class="form-control form-control-sm"
                                       placeholder="Add note..." required>
                                <button class="btn btn-sm btn-primary mt-1">Add Note</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
