<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Courses</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">Course Manager</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="/courses">Courses</a></li>
                <li sec:authorize="isAuthenticated()" class="nav-item"><a class="nav-link" href="/my/courses">My Courses</a></li>
                <li sec:authorize="hasRole('ADMIN')" class="nav-item"><a class="nav-link" href="/courses/admin/new">Create Course</a></li>
            </ul>
            <ul class="navbar-nav">
                <li sec:authorize="isAnonymous()"><a class="nav-link" href="/auth/login">Login</a></li>
                <li sec:authorize="isAnonymous()"><a class="nav-link" href="/auth/register">Register</a></li>
                <li sec:authorize="isAuthenticated()">
                    <form th:action="@{/logout}" method="post" class="d-inline">
                        <button class="btn btn-outline-light btn-sm" type="submit">Logout</button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>
<div class="container mt-4">
    <h2>All Courses</h2>
    <div class="row">
        <div class="col-md-4 mb-3" th:each="course : ${courses}">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title" th:text="${course.title}">Title</h5>
                    <p class="card-text" th:text="${course.description}">Description</p>
                    <p>Enrolled: <span th:text="${course.enrolledCount} + '/' + ${course.maxStudents}"></span></p>
                    <div sec:authorize="isAuthenticated()">
                        <form th:if="${myCourses != null and !myCourses.contains(course) and course.available}"
                              th:action="@{'/courses/' + ${course.id} + '/enroll'}" method="post">
                            <button class="btn btn-success btn-sm">Enroll</button>
                        </form>
                        <form th:if="${myCourses != null and myCourses.contains(course)}"
                              th:action="@{'/courses/' + ${course.id} + '/cancel'}" method="post">
                            <button class="btn btn-danger btn-sm">Cancel</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
